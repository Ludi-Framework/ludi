name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check ludi/ spec/ examples/

  rust:
    strategy:
      matrix:
        include:
          - lua: "5.4"
            feature: lua54
          - lua: "5.5"
            feature: lua55
          # The CLI vendors its own Lua; the gh-actions-lua install is
          # simply unused in this cell.
          - lua: "5.5"
            feature: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Ubuntu has no liblua5.5-dev package yet, so the headers come from
      # gh-actions-lua (installed under .lua/) and LUA_INC points mlua at
      # them — in module mode only headers are needed, nothing is linked.
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - run: LUA_INC=$GITHUB_WORKSPACE/.lua/include cargo test --features ${{ matrix.feature }}

  lua:
    strategy:
      matrix:
        lua: ["5.4", "5.5", "luajit"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}
      - uses: leafo/gh-actions-luarocks@v5
        with:
          luarocksVersion: "3.13.0"
      - run: luarocks install busted
      - run: busted
