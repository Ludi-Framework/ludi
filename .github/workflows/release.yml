name: Build binary rocks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua: ["5.4", "5.5", "luajit"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v5
        with:
          luarocksVersion: "3.13.0"

      - name: Install rust-mlua build backend
        run: luarocks install luarocks-build-rust-mlua

      - name: Build binary rock
        run: luarocks make --pack-binary-rock ludi-dev-1.rockspec

      - uses: actions/upload-artifact@v4
        with:
          name: rock-${{ matrix.os }}-lua${{ matrix.lua }}
          path: "*.rock"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.rock"

  luarocks:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # LUAROCKS_API_KEY lives in the Production environment's secrets.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"

      - uses: leafo/gh-actions-luarocks@v5
        with:
          luarocksVersion: "3.13.0"

      # luarocks upload needs a JSON library to talk to the luarocks.org API.
      - run: luarocks install dkjson

      # The dev rockspec is the single source of truth: stamp the tag's
      # version into it instead of committing one rockspec per release.
      - name: Generate versioned rockspec
        run: |
          VERSION="${GITHUB_REF_NAME#v}-1"
          sed -e "s/^version = \"dev-1\"/version = \"$VERSION\"/" \
              -e "s|^\(   url = .*\)\$|\1,\n   tag = \"$GITHUB_REF_NAME\"|" \
              ludi-dev-1.rockspec > "ludi-$VERSION.rockspec"
          echo "ROCKSPEC=ludi-$VERSION.rockspec" >> "$GITHUB_ENV"
          cat "ludi-$VERSION.rockspec"

      - name: Upload to luarocks.org
        run: luarocks upload "$ROCKSPEC" --api-key "${{ secrets.LUAROCKS_API_KEY }}"
