name: Build binary rocks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Every step shells out to bash (sed, uname, case): pin it so the Windows
# runners use Git Bash instead of their default PowerShell.
defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      # One native runner per OS/arch: binary rocks can't be cross-compiled
      # (the backend links against the host Lua), so every architecture needs
      # its own runner. GitHub provides arm64 images for all three OSes.
      matrix:
        lua: ["5.4", "5.5", "luajit"]
        platform:
          - { os: ubuntu-latest, arch: x86_64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
          - { os: macos-13, arch: x86_64 }
          - { os: macos-latest, arch: arm64 }
          - { os: windows-latest, arch: x86_64 }
          - { os: windows-11-arm, arch: arm64 }

    runs-on: ${{ matrix.platform.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v5
        with:
          luarocksVersion: "3.13.0"

      - name: Install rust-mlua build backend
        run: luarocks install luarocks-build-rust-mlua

      # On a tag, stamp its version into the dev rockspec so the packed
      # rock is named after the release instead of "dev-1".
      - name: Select rockspec
        run: |
          ROCKSPEC=ludi-dev-1.rockspec
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}-1"
            sed -e "s/^version = \"dev-1\"/version = \"$VERSION\"/" \
                -e "s|^\(   url = .*\)\$|\1,\n   tag = \"$GITHUB_REF_NAME\"|" \
                ludi-dev-1.rockspec > "ludi-$VERSION.rockspec"
            ROCKSPEC="ludi-$VERSION.rockspec"
          fi
          echo "ROCKSPEC=$ROCKSPEC" >> "$GITHUB_ENV"

      - name: Build binary rock
        run: luarocks make --pack-binary-rock "$ROCKSPEC"

      # Rocks for different Lua versions share a filename (the .rock name
      # only encodes the platform), so they would overwrite each other in
      # the GitHub release. Suffix the variant; rename it back to the
      # canonical name before feeding it to luarocks install.
      - name: Add the Lua variant to the rock filename
        run: |
          case "${{ matrix.lua }}" in
            luajit*) SUFFIX="${{ matrix.lua }}" ;;
            *) SUFFIX="lua${{ matrix.lua }}" ;;
          esac
          for rock in *.rock; do
            mv "$rock" "${rock%.rock}-$SUFFIX.rock"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rock-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-lua${{ matrix.lua }}
          path: "*.rock"

  # The `ludi` CLI binary (ludi build), one per OS/arch, vendored Lua 5.5.
  # arm64 and x86_64 build on native runners; the 32-bit x86 targets
  # cross-compile from the 64-bit host of the same OS (there are no 32-bit
  # runners, and macOS dropped 32-bit entirely).
  cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, name: linux-x86, packages: gcc-multilib }
          - { os: macos-13, target: x86_64-apple-darwin, name: darwin-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: darwin-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: windows-latest, target: i686-pc-windows-msvc, name: windows-x86 }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, name: windows-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 32-bit cross-compiles need the multilib C toolchain for vendored Lua.
      - name: Install cross toolchain
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}

      - name: Build the ludi CLI
        run: cargo build --release --features cli --bin ludi --target ${{ matrix.target }}

      - name: Name the binary after the platform
        run: |
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            cp "target/${{ matrix.target }}/release/ludi.exe" "ludi-${{ matrix.name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/ludi" "ludi-${{ matrix.name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: "ludi-*"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.rock
            ludi-*

  luarocks:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    # LUAROCKS_API_KEY lives in the Production environment's secrets.
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.5"

      - uses: leafo/gh-actions-luarocks@v5
        with:
          luarocksVersion: "3.13.0"

      # luarocks upload needs a JSON library to talk to the luarocks.org API.
      - run: luarocks install dkjson

      # The dev rockspec is the single source of truth: stamp the tag's
      # version into it instead of committing one rockspec per release.
      - name: Generate versioned rockspec
        run: |
          VERSION="${GITHUB_REF_NAME#v}-1"
          sed -e "s/^version = \"dev-1\"/version = \"$VERSION\"/" \
              -e "s|^\(   url = .*\)\$|\1,\n   tag = \"$GITHUB_REF_NAME\"|" \
              ludi-dev-1.rockspec > "ludi-$VERSION.rockspec"
          echo "ROCKSPEC=ludi-$VERSION.rockspec" >> "$GITHUB_ENV"
          cat "ludi-$VERSION.rockspec"

      # --force makes re-runs idempotent: re-uploading the same version
      # overwrites it instead of failing.
      - name: Upload to luarocks.org
        run: luarocks upload "$ROCKSPEC" --force --api-key "${{ secrets.LUAROCKS_API_KEY }}"
