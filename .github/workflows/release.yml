name: Build binary rocks

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        lua: ["5.4", "luajit"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: ${{ matrix.lua }}

      - uses: leafo/gh-actions-luarocks@v4

      - name: Install rust-mlua build backend
        run: luarocks install luarocks-build-rust-mlua

      - name: Build binary rock
        run: luarocks make --pack-binary-rock ludi-dev-1.rockspec

      - uses: actions/upload-artifact@v4
        with:
          name: rock-${{ matrix.os }}-lua${{ matrix.lua }}
          path: "*.rock"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "*.rock"
